
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REVEL TradeGuard</title>
<style>
:root {
  color-scheme:dark;
  --bg:#0c1420;
  --panel:#192637;
  --line:#354458;
  --muted:#a4b2c4;
  --gold:#e8c27a;
  --green:#5bd6a1;
  --red:#ff8585;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:#edf2f8;
  font:15px system-ui,-apple-system,Arial,sans-serif;
}
main{max-width:760px;margin:auto;padding:18px}
header{
  display:flex;justify-content:space-between;
  align-items:center;gap:10px;
}
h1{font-size:21px;color:var(--gold);margin:14px 0}
h2{font-size:17px;margin:0 0 13px}
.badge{
  font-size:11px;color:var(--gold);
  border:1px solid var(--gold);
  padding:6px;border-radius:8px;
}
.card{
  background:var(--panel);padding:17px;
  border-radius:14px;margin:13px 0;
}
.muted,small,.note{color:var(--muted)}
.value{font-size:35px;font-weight:750;margin:8px 0}
.green{color:var(--green)}
.red{color:var(--red)}
.row{
  display:flex;justify-content:space-between;
  gap:12px;align-items:center;padding:12px 0;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.tabs{
  display:flex;gap:7px;overflow-x:auto;
  padding:10px 0;
}
.tabs button{flex:0 0 auto}
.tabs button.active{
  background:var(--gold);color:#101824;
}
button{
  border:1px solid var(--line);
  background:#253449;color:#edf2f8;
  padding:11px 13px;border-radius:9px;
  font:inherit;font-weight:650;cursor:pointer;
}
button.primary{
  background:var(--gold);color:#101824;border:0;
}
input,select{
  display:block;width:100%;font:inherit;
  padding:12px;background:#0c1420;
  border:1px solid #53627a;color:white;
  border-radius:9px;margin:8px 0;
}
label{
  display:block;font-size:12px;
  color:var(--muted);margin-top:12px;
}
.full{width:100%}
.grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.stat{
  background:#142031;border-radius:10px;padding:12px;
}
.stat strong{
  display:block;margin-top:7px;font-size:19px;
}
.note{font-size:12px;line-height:1.6}
.warning{
  background:#302b24;border:1px solid #62523b;
  padding:12px;border-radius:10px;
}
.chart{width:100%;height:160px}
.hidden{display:none!important}
.history{max-height:330px;overflow:auto}
.stockname{
  font-size:12px;color:var(--muted);margin-top:3px;
}
footer{
  margin:22px 0;color:var(--muted);
  font-size:12px;line-height:1.6;
}
.tag{
  display:inline-block;fon<header>
<h1>REVEL / TRADEGUARD</h1>
<span class="badge">PAPER TRADING</span>
</header>
<div class="status">
<span id="feedStatus">Connecting…</span>
<span id="updated"></span>
</div>

<nav id="tabs" class="tabs"></nav>

<section class="card">
<small>TOTAL PORTFOLIO EQUITY</small>
<div class="value" id="equity">—</div>
<strong id="totalPL">—</strong>
<div class="grid" style="margin-top:15px">
<div class="stat">
<small>Available cash</small>
<strong id="cash">—</strong>
</div>
<div class="stat">
<small>Open positions</small>
<strong id="openCount">0</strong>
</div>
</div>
</section>

<section id="allPanel">
<div class="card">
<h2>All Stocks</h2>
<div id="allStocks"></div>
</div>

<div class="card">
<h2>Portfolio Performance</h2>
<svg class="chart" id="chart"
 viewBox="0 0 340 160"></svg>
<div id="chartLabel" class="note">
No recorded valuations yet.
</div>
</div>

<div class="card">
<h2>Trading Activity</h2>
<div id="allHistory" class="history note">
No trades recorded.
</div>
</div>
</section>

<section id="stockPanel" class="hidden">
<div class="card">
<h2 id="stockTitle"></h2>
<div class="row">
<span>Last verified price (AUD)</span>
<strong id="stockPrice">Awaiting price</strong>
</div>
<div class="row">
<span>Market status</span>
<span id="stockMarket" class="note">—</span>
</div>
<div class="row">
<span>Native price</span>
<span class="note" id="stockNative">—</span>
</div>
<div class="row">
<span>AUD conversion</span>
<span class="note" id="stockFx">—</span>
</div>
<div class="row">
<span>Price source</span>
<span class="note" id="stockSource">Not connected</span>
</div>
<div class="row">
<span>Shares held</span>
<strong id="stockShares">0</strong>
</div>
<div class="row">
<span>Position value</span>
<strong id="stockValue">A$0.00</strong>
</div>
<div class="row">
<span>Allocation (target / limit)</span>
<strong id="stockAlloc">0.0%</strong>
</div>
<div class="row">
<span>Stock profit / loss</span>
<strong id="stockPL">A$0.00</strong>
</div>
<p class="note" id="stockNote"></p>
</div>

<div class="card">
<h2>Stock Trade History</h2>
<div id="stockHistory" class="history note">
No trades recorded.
</div>
</div>
</section>

<div class="card">
<h2>Risk Rules</h2>
<div class="row">
<span>Maximum stock allocation</span><strong>20%</strong>
</div>
<div class="row">
<span>Minimum cash reserve</span><strong>30%</strong>
</div>
<div class="row">
<span>Halt new buys at equity of</span><strong>A$2,500</strong>
</div>
<div class="row">
<span>Strategy</span><strong>Equal weight 14% each</strong>
</div>
<div class="row">
<span>Buying status</span><strong id="haltStatus">—</strong>
</div>
<p class="note">
The simulation buys each stock towards 14% of equity
(70% invested, 30% cash) and trims any position above 20%.
It only trades while that stock's market is open and its
verified quote is fresh. Fees are assumed to be A$0.
</p>
</div>

<div id="message" class="warning note">
Waiting for verified prices.
</div>

<div class="card">
<h2>Data &amp; Backup</h2>
<p class="note">
All trades, cash, positions and valuations are stored
in the TradeGuard database and update automatically.
Prices refresh every 15 minutes on weekdays.
</p>
<button id="export">Export Ledger JSON</button>
</div>

<footer>
REVEL TradeGuard · A$5,000 virtual starting capital.
Simulated paper trading only. Not connected to any broker
and no real orders are ever placed.
Prices from Twelve Data, converted to AUD at the quoted
FX rate. Quotes may be delayed; check timestamps.
</footer>

</main>

<script>
'use strict';

const $=id=>document.getElementById(id);
const fmt=n=>'A$'+Number(n).toLocaleString('en-AU',
 {minimumFractionDigits:2,maximumFractionDigits:2});
const signed=n=>(n>=0?'+':'-')+fmt(Math.abs(n));
const esc=v=>String(v??'').replaceAll('&','&amp;')
 .replaceAll('<','&lt;').replaceAll('>','&gt;');
const when=t=>new Date(t).toLocaleString('en-AU',
 {dateStyle:'medium',timeStyle:'short'});

let data=null;
let active='ALL';
let refreshing=false;

const stock=s=>data.stocks.find(x=>x.symbol===s);
const value=st=>st.shares*(st.price?.priceAud||0);

function priceState(p){
 if(!p)return {cls:'',label:'NO PRICE',text:'No verified price yet'};
 const age=Math.round((Date.now()-new Date(p.quoteTime))/60000);
 const ageTxt=age<60?`${age} min`:age<2880?
  `${Math.round(age/60)} h`:`${Math.round(age/1440)} d`;
 if(!p.marketOpen)return {cls:'closed',label:'MARKET CLOSED',
  text:`Market closed · last price ${when(p.quoteTime)}`};
 if(age>5)return {cls:'delayed',label:`DELAYED ${ageTxt}`,
  text:`Market open · quote delayed ${ageTxt} (${when(p.quoteTime)})`};
 return {cls:'live',label:'LIVE',
  text:`Market open · quote ${when(p.quoteTime)}`};
}

function stockProfit(s){
 const st=stock(s);
 const flow=data.trades.filter(t=>t.symbol===s)
  .reduce((a,t)=>a+(t.side==='SELL'?t.valueAud:-t.valueAud),0);
 return value(st)+flow;
}

function stockRow(st){
 const ps=priceState(st.price);
 const pnl=stockProfit(st.symbol);
 return `
 <div class="row">
 <div>
 <strong>${esc(st.symbol)}</strong>
 <span class="tag ${ps.cls}">${ps.label}</span>
 <div class="stockname">${esc(st.name)}</div>
 <div class="stockname">${st.shares.toFixed(4)} shares</div>
 </div>
 <div style="text-align:right">
 <strong>${st.price?fmt(st.price.priceAud):'Awaiting price'}</strong>
 <div class="stockname">
 ${st.shares?fmt(value(st)):'No position'}
 </div>
 <div class="stockname ${pnl<0?'red':'green'}">
 ${signed(pnl)} P/L
 </div>
 </div>
 </div>`;
}

function historyRows(items){
 if(!items.length)return 'No trades recorded.';
 return items.map(t=>`
 <div class="row">
 <div>
 <strong>${t.side} ${esc(t.symbol)}</strong>
 <div class="stockname">
 ${Number(t.shares).toFixed(4)} shares @ ${fmt(t.priceAud)}
 · ${when(t.executedAt)}
 </div>
 <div class="stockname">
 ${t.currency} ${Number(t.priceNative).toFixed(2)} × FX
 ${Number(t.fxRate).toFixed(4)} · quote ${when(t.quoteTime)}
 </div>
 <div class="stockname">${esc(t.rule)}</div>
 </div>
 <strong>${fmt(t.valueAud)}</strong>
 </div>`).join('');
}

function chart(){
 const h=data.equityHistory;
 if(h.length<2){
  $('chart').innerHTML='';
  $('chartLabel').textContent=h.length?
   '1 recorded valuation so far.':'No recorded valuations yet.';
  return;
 }
 const vals=h.map(v=>v.equity);
 const lo=Math.min(...vals,data.rules.startCapital)-1;
 const hi=Math.max(...vals,data.rules.startCapital)+1;
 const y=v=>135-(v-lo)/(hi-lo)*112;
 const pts=vals.map((v,i)=>
  `${12+i*316/(vals.length-1)},${y(v)}`).join(' ');
 $('chart').innerHTML=`
 <line x1="12" y1="135" x2="328" y2="135" stroke="#42516a"/>
 <line x1="12" y1="${y(data.rules.startCapital)}" x2="328"
 y2="${y(data.rules.startCapital)}" stroke="#42516a"
 stroke-dasharray="4 4"/>
 <polyline points="${pts}" fill="none" stroke="#e8c27a"
 stroke-width="3" stroke-linejoin="round"/>`;
 $('chartLabel').textContent=
  `${h.length} recorded valuations from ${when(h[0].recordedAt)}
  to ${when(h[h.length-1].recordedAt)}. Dashed line: A$5,000 start.`;
}

function render(){
 if(!data)return;
 const a=data.account;
 $('equity').textContent=fmt(a.equity);
 $('totalPL').textContent=
  `${signed(a.profitLoss)} (${(a.profitLoss/a.startingCapital*100).toFixed(2)}%)`;
 $('totalPL').className=a.profitLoss<0?'red':'green';
 $('cash').textContent=fmt(a.cash);
 $('openCount').textContent=data.stocks.filter(s=>s.shares>0).length;
 $('allStocks').innerHTML=data.stocks.map(stockRow).join('');
 $('allHistory').innerHTML=historyRows(data.trades);
 $('haltStatus').textContent=a.buysHalted?
  'HALTED (equity ≤ A$2,500)':'Active';
 $('haltStatus').className=a.buysHalted?'red':'green';
 chart();

 $('allPanel').classList.toggle('hidden',active!=='ALL');
 $('stockPanel').classList.toggle('hidden',active==='ALL');
 document.querySelectorAll('#tabs button').forEach(b=>
  b.classList.toggle('active',b.dataset.tab===active));

 const r=data.lastRun;
 const anyOpen=data.stocks.some(s=>s.price?.marketOpen);
 $('feedStatus').textContent=!data.providerConfigured?
  'Price feed not configured':
  !r?'Awaiting first price refresh':
  `Last refresh ${when(r.startedAt)} · ${r.message||r.status}`+
  (data.stocks.some(s=>s.price)&&!anyOpen?' · Markets closed':'');
 $('updated').textContent=`Dashboard updated ${
  new Date(data.serverTime).toLocaleTimeString('en-AU')}`;

 const notes=r?.notes||[];
 $('message').textContent=a.buysHalted?
  'BUYS HALTED: portfolio equity is at or below A$2,500. Only trims are allowed.':
  r?.status==='error'?`Last refresh failed: ${r.message||'unknown error'}. No trades were made.`:
  notes.length?notes.join(' '):
  r?'Latest refresh completed. All figures come from recorded verified prices and simulated trades.':
  'Waiting for verified prices. No trades are made until real prices are recorded.';

 if(active!=='ALL'){
  const st=stock(active), p=st.price, ps=priceState(p);
  const e=a.equity, alloc=e>0?value(st)/e*100:0;
  $('stockTitle').textContent=`${st.symbol} · ${st.name}`;
  $('stockPrice').textContent=p?fmt(p.priceAud):'Awaiting price';
  $('stockMarket').innerHTML=`<span class="tag ${ps.cls}">${ps.label}</span> ${esc(ps.text)}`;
  $('stockNative').textContent=p?
   `${p.currency} ${p.priceNative.toFixed(2)} · ${p.providerSymbol} on ${p.exchange}`:'—';
  $('stockFx').textContent=p?
   `${p.fxPair} ${p.fxRate.toFixed(5)} (rate time ${when(p.fxTime)})`:'—';
  $('stockSource').textContent=p?
   `${p.source}, fetched ${when(p.fetchedAt)}`:'Not connected';
  $('stockShares').textContent=st.shares.toFixed(4);
  $('stockValue').textContent=fmt(value(st));
  $('stockAlloc').textContent=`${alloc.toFixed(1)}% (14% / 20%)`;
  $('stockPL').textContent=signed(stockProfit(st.symbol));
  $('stockPL').className=stockProfit(st.symbol)<0?'red':'green';
  $('stockNote').textContent=st.note;
  $('stockHistory').innerHTML=historyRows(
   data.trades.filter(t=>t.symbol===st.symbol));
 }
}

async function load(){
 try{
  const res=await fetch('/api/dashboard',{cache:'no-store'});
  if(!res.ok)throw Error('HTTP '+res.status);
  data=await res.json();
  if(!$('tabs').children.length)buildTabs();
  render();
  maybeRefresh();
 }catch(err){
  $('feedStatus').textContent='Dashboard offline: '+err.message+
   ' · showing last loaded data';
 }
}

async function maybeRefresh(){
 if(refreshing||!data.providerConfigured)return;
 const last=data.lastRun?new Date(data.lastRun.startedAt):0;
 if(last&&Date.now()-last<(data.rules.refreshIntervalMin+1)*60000)return;
 refreshing=true;
 try{
  const r=await fetch('/api/refresh',{method:'POST'})
   .then(r=>r.json());
  if(r.ran)await load();
 }catch(e){}
 refreshing=false;
}

function buildTabs(){
 $('tabs').innerHTML=['ALL',...data.stocks.map(s=>s.symbol)]
  .map(s=>`<button type="button" data-tab="${s}">
  ${s==='ALL'?'ALL STOCKS':s}</button>`).join('');
}

$('tabs').addEventListener('click',e=>{
 const b=e.target.closest('button[data-tab]');
 if(b){active=b.dataset.tab;render();}
});

$('export').addEventListener('click',async()=>{
 const res=await fetch('/api/dashboard?full=1',{cache:'no-store'});
 const ledger=await res.json();
 const blob=new Blob([JSON.stringify({
  format:'REVEL-paper-v3',exported:new Date().toISOString(),ledger
 },null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;a.download='revel-tradeguard-ledger.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
});

load();
setInterval(load,60000);
setInterval(render,30000);
</script>
</body>
</html>
